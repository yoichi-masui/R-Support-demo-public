
name: Quarto Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# gh-pages ブランチへ push するための権限
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "stable"   # 固定したい場合は "1.6.39" など

      # R チャンクがあるため R をセットアップ
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"  # 社内標準に合わせて変更可

      # 最低限の R パッケージをインストール（必要に応じて追加）
      - name: Install R packages
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org"))'
          Rscript -e 'base_pkgs <- c("rmarkdown","knitr"); \
                      inst <- rownames(installed.packages()); \
                      to_install <- setdiff(base_pkgs, inst); \
                      if (length(to_install)) install.packages(to_install)'
          Rscript -e 'pkgs <- c("tidyverse","rtables","admiral","lubridate","janitor","ggplot2","dplyr","tidyr"); \
                      inst <- rownames(installed.packages()); \
                      to_install <- setdiff(pkgs, inst); \
                      if (length(to_install)) install.packages(to_install)'

      # Quarto がビルドして gh-pages に公開
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
